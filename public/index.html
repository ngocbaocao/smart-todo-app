<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit & Work Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Patrick Hand', cursive;
      background-color: #f3efe6;
      color: #1a1a1a;
    }

    /* Khung sổ tay 3D */
    .notepad-card {
      background-color: #fbf9f4;
      border: 2px solid #1a1a1a;
      border-radius: 16px;
      box-shadow: 
        -4px 4px 0px 0px #fbf9f4,
        -4px 4px 0px 2px #1a1a1a,
        -8px 8px 0px 0px #fbf9f4,
        -8px 8px 0px 2px #1a1a1a;
    }

    /* Ô checkbox nét vẽ */
    .checkbox-custom {
      width: 22px;
      height: 22px;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background-color: transparent;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checkbox-custom-checked {
      background-color: #1a1a1a;
    }

    /* Dòng kẻ ngang công việc */
    .task-row {
      border-bottom: 1.5px solid #dcd7cd;
    }

    /* Tab ngày trong tuần */
    .day-tab {
      border: 1.5px solid #1a1a1a;
      border-radius: 8px;
      padding: 4px 0;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      background-color: transparent;
    }

    .day-tab-active {
      background-color: #1a1a1a;
      color: #fbf9f4;
    }

    /* Dropdown định dạng tối giản */
    .select-custom {
      background: transparent;
      border: 1.5px solid #1a1a1a;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 1.1rem;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen py-6 px-3 flex justify-center items-center">

  <div class="w-full max-w-md notepad-card p-5 sm:p-7 my-2">
    
    <!-- Header Họa tiết -->
    <div class="flex items-center justify-center gap-2 mb-2 text-[#1a1a1a]">
      <div class="h-[1.5px] bg-[#1a1a1a] flex-1 max-w-[40px]"></div>
      <span class="text-xs">●</span>
      <span class="text-sm">✦</span>
      <span class="text-lg">✦</span>
      <span class="text-sm">✦</span>
      <span class="text-xs">●</span>
      <div class="h-[1.5px] bg-[#1a1a1a] flex-1 max-w-[40px]"></div>
    </div>

    <!-- Tên ứng dụng -->
    <h1 class="text-2xl font-bold text-center tracking-[0.1em] mb-4 uppercase text-[#1a1a1a]">
      HABIT & WORK TRACKER
    </h1>

    <!-- Bộ chọn THÁNG & TUẦN -->
    <div class="flex justify-between items-center gap-2 mb-4 bg-[#f3efe6] p-2.5 rounded-xl border border-[#1a1a1a]">
      <div class="flex items-center gap-1">
        <span class="text-lg font-bold">Tháng:</span>
        <select id="monthSelect" class="select-custom" onchange="onMonthOrWeekChange()"></select>
      </div>

      <div class="flex items-center gap-1">
        <span class="text-lg font-bold">Tuần:</span>
        <select id="weekSelect" class="select-custom" onchange="onMonthOrWeekChange()">
          <option value="0">Tuần 1</option>
          <option value="1">Tuần 2</option>
          <option value="2">Tuần 3</option>
          <option value="3">Tuần 4</option>
          <option value="4">Tuần 5</option>
        </select>
      </div>
    </div>

    <!-- Thanh 7 Ngày Trong Tuần (Thứ 2 - CN) -->
    <div id="daysContainer" class="grid grid-cols-7 gap-1 mb-3"></div>

    <!-- Dòng hiển thị Ngày/Tháng/Năm thực tế -->
    <div class="text-center text-lg font-bold text-[#1a1a1a] mb-5 border-b border-[#1a1a1a] pb-2">
      📅 <span id="fullDateLabel">Đang tải ngày...</span>
    </div>

    <!-- Form Nhập Công Việc -->
    <form id="taskForm" class="flex gap-2 mb-5">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Viết công việc/thói quen..." 
        required
        class="flex-1 px-3 py-1 bg-transparent border-b-2 border-[#1a1a1a] focus:outline-none text-xl placeholder-[#9e9689]"
      />
      <button 
        type="submit" 
        class="border-2 border-[#1a1a1a] px-3 py-1 rounded-lg text-lg font-bold hover:bg-[#1a1a1a] hover:text-[#fbf9f4] transition"
      >
        + Thêm
      </button>
    </form>

    <!-- Danh Sách Công Việc -->
    <ul id="taskList" class="space-y-1">
      <li class="text-center text-gray-400 py-4 text-xl">Đang tải danh sách...</li>
    </ul>

  </div>

  <!-- POPUP CÀI ĐẶT 3 CHẤM (Chỉnh sửa tên & Đánh dấu Ưu tiên) -->
  <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden z-50 px-4">
    <div class="w-full max-w-sm notepad-card p-6 bg-[#fbf9f4]">
      <h2 class="text-2xl font-bold mb-4 text-center border-b border-[#1a1a1a] pb-2">⚙️ Tùy Chỉnh Công Việc</h2>
      
      <!-- 1. ✏️ Chỉnh sửa tên công việc/thói quen -->
      <div class="mb-4">
        <label class="block text-lg font-bold mb-1">✏️ Tên công việc / thói quen:</label>
        <input 
          type="text" 
          id="modalTitleInput" 
          class="w-full px-3 py-1.5 bg-transparent border-2 border-[#1a1a1a] rounded-lg text-xl focus:outline-none"
        />
      </div>

      <!-- 2. 🔥 Đánh dấu Ưu tiên (Priority Flag 🔴) -->
      <div class="mb-6 flex items-center gap-3 bg-[#f3efe6] p-3 rounded-lg border border-[#1a1a1a]">
        <input 
          type="checkbox" 
          id="modalPriorityInput" 
          class="w-5 h-5 accent-[#1a1a1a] cursor-pointer"
        />
        <label for="modalPriorityInput" class="text-lg font-bold cursor-pointer select-none">
          🔥 Đánh dấu Ưu tiên (Priority 🔴)
        </label>
      </div>

      <!-- Nút thao tác -->
      <div class="flex justify-end gap-2 pt-2 border-t border-[#1a1a1a]">
        <button 
          onclick="closeEditModal()" 
          class="px-4 py-1 border-2 border-gray-400 text-gray-600 rounded-lg text-lg font-bold hover:bg-gray-200 transition"
        >
          Hủy
        </button>
        <button 
          onclick="saveTaskEdit()" 
          class="px-5 py-1 border-2 border-[#1a1a1a] bg-[#1a1a1a] text-[#fbf9f4] rounded-lg text-lg font-bold hover:opacity-90 transition"
        >
          Lưu
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/tasks';
    const dayNames = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
    const fullDayNames = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

    let currentDateState = new Date();
    let currentWeekDays = [];
    let selectedDayIndex = 0;
    let editingTaskData = null; // Lưu công việc đang sửa

    function initApp() {
      populateMonths();
      setSelectsToDate(currentDateState);
      updateWeekAndDays();
      
      const today = new Date();
      const matchIndex = currentWeekDays.findIndex(d => isSameDate(d, today));
      selectedDayIndex = matchIndex !== -1 ? matchIndex : 0;

      renderDayTabs();
      fetchTasks();
    }

    function populateMonths() {
      const monthSelect = document.getElementById('monthSelect');
      monthSelect.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `Thg ${i + 1}`;
        monthSelect.appendChild(opt);
      }
    }

    function setSelectsToDate(date) {
      document.getElementById('monthSelect').value = date.getMonth();
      const firstDayOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
      const weekIndex = Math.floor((date.getDate() + firstDayOfMonth.getDay() - 1) / 7);
      document.getElementById('weekSelect').value = Math.min(weekIndex, 4);
    }

    function updateWeekAndDays() {
      const year = currentDateState.getFullYear();
      const month = parseInt(document.getElementById('monthSelect').value);
      const weekIndex = parseInt(document.getElementById('weekSelect').value);

      const firstOfMonth = new Date(year, month, 1);
      let dayOfWeek = firstOfMonth.getDay();
      let diffToMonday = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);

      let mondayOfWeek1 = new Date(year, month, 1 + diffToMonday);
      let targetMonday = new Date(mondayOfWeek1);
      targetMonday.setDate(mondayOfWeek1.getDate() + (weekIndex * 7));

      currentWeekDays = [];
      for (let i = 0; i < 7; i++) {
        let d = new Date(targetMonday);
        d.setDate(targetMonday.getDate() + i);
        currentWeekDays.push(d);
      }
    }

    function onMonthOrWeekChange() {
      const month = parseInt(document.getElementById('monthSelect').value);
      currentDateState.setMonth(month);
      updateWeekAndDays();
      renderDayTabs();
      fetchTasks();
    }

    function renderDayTabs() {
      const container = document.getElementById('daysContainer');
      container.innerHTML = '';

      currentWeekDays.forEach((dateObj, idx) => {
        const tab = document.createElement('div');
        tab.className = `day-tab ${idx === selectedDayIndex ? 'day-tab-active' : ''}`;
        tab.innerHTML = `
          <div class="text-xs">${dayNames[idx]}</div>
          <div class="text-sm">${dateObj.getDate()}</div>
        `;
        tab.onclick = () => selectDay(idx);
        container.appendChild(tab);
      });

      const activeDate = currentWeekDays[selectedDayIndex];
      const dayNameFull = fullDayNames[activeDate.getDay()];
      const dd = String(activeDate.getDate()).padStart(2, '0');
      const mm = String(activeDate.getMonth() + 1).padStart(2, '0');
      const yyyy = activeDate.getFullYear();

      document.getElementById('fullDateLabel').textContent = `${dayNameFull}, ${dd}/${mm}/${yyyy}`;
    }

    function selectDay(index) {
      selectedDayIndex = index;
      renderDayTabs();
      fetchTasks();
    }

    function getSelectedDateString() {
      const activeDate = currentWeekDays[selectedDayIndex];
      const yyyy = activeDate.getFullYear();
      const mm = String(activeDate.getMonth() + 1).padStart(2, '0');
      const dd = String(activeDate.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    async function fetchTasks() {
      const dateStr = getSelectedDateString();
      try {
        const res = await fetch(`${API_URL}?date=${dateStr}`);
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        document.getElementById('taskList').innerHTML = `
          <li class="text-center text-red-500 py-4 text-xl">❌ Lỗi kết nối Backend!</li>
        `;
      }
    }

    function renderTasks(tasks) {
      const listEl = document.getElementById('taskList');
      if (tasks.length === 0) {
        listEl.innerHTML = '<li class="text-center text-gray-400 py-6 text-xl">Chưa có thói quen / công việc nào.</li>';
        return;
      }

      listEl.innerHTML = tasks.map(task => `
        <li class="flex items-center gap-2 py-2.5 task-row group">
          <!-- Checkbox -->
          <div 
            class="checkbox-custom ${task.isCompleted ? 'checkbox-custom-checked' : ''}" 
            onclick="toggleTask('${task._id}')"
          >
            ${task.isCompleted ? '<i class="fa-solid fa-check text-white text-xs"></i>' : ''}
          </div>
          
          <!-- Nội dung & Hiển thị cờ Ưu tiên 🔴 -->
          <span 
            onclick="toggleTask('${task._id}')"
            class="flex-1 text-xl cursor-pointer select-none ${task.isCompleted ? 'line-through text-gray-400' : 'text-[#1a1a1a]'}"
          >
            ${task.priority === 'high' ? '<span class="text-red-600 font-bold mr-1">[🔴 HOT]</span>' : ''}
            ${task.title}
          </span>

          <!-- Nút 3 Chấm Dọc (Menu) -->
          <button 
            onclick="openEditModal('${task._id}', '${escapeHtml(task.title)}', '${task.date}', '${task.priority}')" 
            class="text-gray-500 hover:text-black px-2 py-1 transition text-lg"
            title="Tùy chỉnh"
          >
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>

          <!-- Nút Xóa nhanh -->
          <button 
            onclick="deleteTask('${task._id}')" 
            class="text-gray-400 hover:text-red-600 p-1 transition opacity-70 group-hover:opacity-100"
            title="Xóa"
          >
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Mở Modal Popup 3 Chấm
    function openEditModal(id, title, date, priority) {
      editingTaskData = { id, date };
      document.getElementById('modalTitleInput').value = title;
      document.getElementById('modalPriorityInput').checked = (priority === 'high');
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      editingTaskData = null;
      document.getElementById('editModal').classList.add('hidden');
    }

    // Lưu Chỉnh sửa Tên & Ưu tiên
    async function saveTaskEdit() {
      if (!editingTaskData) return;
      
      const newTitle = document.getElementById('modalTitleInput').value.trim();
      const isHighPriority = document.getElementById('modalPriorityInput').checked;

      if (!newTitle) return;

      await fetch(`${API_URL}/${editingTaskData.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          title: newTitle, 
          date: editingTaskData.date, 
          priority: isHighPriority ? 'high' : 'normal' 
        })
      });

      closeEditModal();
      fetchTasks();
    }

    // Thêm công việc mới
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;

      const date = getSelectedDateString();

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, date, priority: 'normal' })
      });

      input.value = '';
      fetchTasks();
    });

    async function toggleTask(id) {
      await fetch(`${API_URL}/${id}/toggle`, { method: 'PATCH' });
      fetchTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    function isSameDate(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    initApp();
  </script>
</body>
</html>
