<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic To-Do List</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts - Patrick Hand cho phông chữ viết tay tối giản -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <style>
    /* Phông chữ viết tay & màu nền tổng thể */
    body {
      font-family: 'Patrick Hand', cursive;
      background-color: #f3efe6;
      color: #1a1a1a;
    }

    /* Hiệu ứng gáy tập giấy 3D ở góc trái và đáy */
    .notepad-card {
      background-color: #fbf9f4;
      border: 2px solid #1a1a1a;
      border-radius: 12px;
      box-shadow: 
        -4px 4px 0px 0px #fbf9f4,
        -4px 4px 0px 2px #1a1a1a,
        -8px 8px 0px 0px #fbf9f4,
        -8px 8px 0px 2px #1a1a1a;
    }

    /* Ô vuông checkbox nét vẽ tối giản */
    .checkbox-custom {
      width: 22px;
      height: 22px;
      border: 2px solid #1a1a1a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background-color: transparent;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .checkbox-custom-checked {
      background-color: #1a1a1a;
    }

    /* Đường kẻ ngang thanh lịch cho mỗi dòng công việc */
    .task-row {
      border-bottom: 1.5px solid #dcd7cd;
    }
  </style>
</head>
<body class="min-h-screen py-10 px-4 flex justify-center items-center">

  <div class="w-full max-w-md notepad-card p-6 sm:p-8 my-4">
    
    <!-- Họa tiết Header: Thanh ngang & Ngôi sao ✦ -->
    <div class="flex items-center justify-center gap-2 mb-3 text-[#1a1a1a]">
      <div class="h-[1.5px] bg-[#1a1a1a] flex-1 max-w-[60px]"></div>
      <span class="text-xs">●</span>
      <span class="text-sm">✦</span>
      <span class="text-lg">✦</span>
      <span class="text-sm">✦</span>
      <span class="text-xs">●</span>
      <div class="h-[1.5px] bg-[#1a1a1a] flex-1 max-w-[60px]"></div>
    </div>

    <!-- Tiêu đề "TO DO LIST" -->
    <h1 class="text-3xl font-bold text-center tracking-[0.25em] mb-6 uppercase text-[#1a1a1a]">
      T O &nbsp; D O &nbsp; L I S T
    </h1>

    <!-- Form nhập công việc -->
    <form id="taskForm" class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Viết công việc mới..." 
        required
        class="flex-1 px-3 py-1.5 bg-transparent border-b-2 border-[#1a1a1a] focus:outline-none text-xl placeholder-[#9e9689]"
      />
      <button 
        type="submit" 
        class="border-2 border-[#1a1a1a] px-4 py-1 rounded-lg text-lg font-bold hover:bg-[#1a1a1a] hover:text-[#fbf9f4] transition"
      >
        + Thêm
      </button>
    </form>

    <!-- Danh sách công việc -->
    <ul id="taskList" class="space-y-1">
      <li class="text-center text-gray-400 py-4 text-xl">Đang tải danh sách...</li>
    </ul>

  </div>

  <script>
    const API_URL = '/api/tasks';

    // 1. Tải danh sách công việc
    async function fetchTasks() {
      try {
        const res = await fetch(API_URL);
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        document.getElementById('taskList').innerHTML = `
          <li class="text-center text-red-500 py-4 text-xl">❌ Lỗi kết nối Backend!</li>
        `;
      }
    }

    // 2. Hiển thị danh sách
    function renderTasks(tasks) {
      const listEl = document.getElementById('taskList');
      if (tasks.length === 0) {
        listEl.innerHTML = '<li class="text-center text-gray-400 py-6 text-xl">Chưa có công việc nào.</li>';
        return;
      }

      listEl.innerHTML = tasks.map(task => `
        <li class="flex items-center gap-3 py-2.5 task-row group">
          <!-- Ô Checkbox -->
          <div 
            class="checkbox-custom ${task.isCompleted ? 'checkbox-custom-checked' : ''}" 
            onclick="toggleTask('${task._id}')"
          >
            ${task.isCompleted ? '<i class="fa-solid fa-check text-white text-xs"></i>' : ''}
          </div>
          
          <!-- Nội dung công việc -->
          <span 
            onclick="toggleTask('${task._id}')"
            class="flex-1 text-xl cursor-pointer select-none ${task.isCompleted ? 'line-through text-gray-400' : 'text-[#1a1a1a]'}"
          >
            ${task.title}
          </span>

          <!-- Nút xóa -->
          <button 
            onclick="deleteTask('${task._id}')" 
            class="text-gray-400 hover:text-red-600 p-1 transition opacity-70 group-hover:opacity-100"
            title="Xóa"
          >
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        </li>
      `).join('');
    }

    // 3. Thêm công việc mới
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      input.value = '';
      fetchTasks();
    });

    // 4. Tick hoàn thành (Báo Telegram)
    async function toggleTask(id) {
      await fetch(`${API_URL}/${id}/toggle`, { method: 'PATCH' });
      fetchTasks();
    }

    // 5. Xóa công việc
    async function deleteTask(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    // Khởi chạy khi mở trang
    fetchTasks();
  </script>
</body>
</html>
